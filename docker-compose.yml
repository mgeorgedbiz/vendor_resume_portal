version: '3.8'

services:
  db:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_DATABASE: resume_vendor
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://db:27017/resume_vendor
      JWT_SECRET: change-this-to-a-random-secret-in-production
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:4000/api
    depends_on:
      - server

volumes:
  mongodata:
